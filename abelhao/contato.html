<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="img/colmeia-de-abelhas.png">
    <title>Contato</title>
    <!-- Adicionando o link para a fonte Lobster -->
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <style>
        .contato-pagina {
            text-align: center;
            margin-top: 50px;
        }

        .contato-info {
            margin-top: 20px;
        }

        .contato-icone {
            width: 40px;
            margin-right: 10px;
            vertical-align: middle;
        }

        .contato-info a, .contato-info p {
            font-size: 18px;
            margin: 15px 0;
            text-decoration: none;
            color: #444;
        }

        .contato-info a:hover {
            color: #007bff;
        }

        .logo {
            font-size: 24px;
            font-family: 'Lobster', cursive; /* Agora a fonte Lobster deve funcionar corretamente */
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%; /* Garante que a altura total seja usada */
            display: flex;
            flex-direction: column; /* Organiza os elementos verticalmente */
        }

        main {
            flex: 1; /* Faz o conteúdo principal ocupar o espaço restante */
        }

        footer {
            background-color: #f4c542;
            color: #333;
            text-align: center;
            padding: 20px 0;
            margin-top: auto; /* Empurra o footer para o final */
        }
    </style>
    <script>
        // Abrir modal
        document.querySelector('a[href="#contato"]').addEventListener('click', function (event) {
            event.preventDefault();
            document.getElementById('contato-modal').style.display = 'flex';
        });

        // Fechar modal
        function fecharModal() {
            document.getElementById('contato-modal').style.display = 'none';
        }
    </script>
</head>
<body>
    <header>
        <div class="logo">🐝 Beekeepers</div>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Início</a></li>
                <li><a href="menu.html">Produtos</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="contato-pagina">
        <h1>Entre em Contato</h1>
        <div class="contato-info">
            <a href="https://wa.me/5551999999999" target="_blank">
                <img src="img/whatsapp.png" alt="WhatsApp" class="contato-icone">
                WhatsApp
            </a>
            <p>
                <img src="img/e-mail.png" alt="E-mail" class="contato-icone">
                contato@beekeepers.com
            </p>
        </div>
    </main>

          <!--Libra-->
        
          <div vw class="enabled">
            <div vw-access-button class="active"></div>
            <div vw-plugin-wrapper>
              <div class="vw-plugin-top-wrapper"></div>
            </div>
          </div>
          <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
          <script>
            new window.VLibras.Widget('https://vlibras.gov.br/app');
          </script>

    <footer>
        <p>&copy; 2025 Beekeepers. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
